<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kaushiki — Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#ecece8;--paper2:#e1e4e8;--ink:#14233b;--clay:#1f4a86;--blush:#c9d8ea;--leaf:#2f6b3a;--leaf2:#8fb34a;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);background-image:repeating-linear-gradient(0deg,#0000 0 2px,#00000009 2px 3px),repeating-linear-gradient(90deg,#0000 0 2px,#00000009 2px 3px);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow-x:hidden;position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/><feColorMatrix values='0 0 0 0 .3  0 0 0 0 .34  0 0 0 0 .42  0 0 0 .3 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.stage{position:relative;width:min(94vw,980px);aspect-ratio:1.45/1;margin:24px auto}
.badge{position:absolute;left:50%;top:0;width:46%;transform:translateX(-50%);z-index:6;pointer-events:none;mix-blend-mode:multiply}
#frame{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;left:10%;right:10%;top:22%;bottom:8%;background:var(--paper);border:1.5px solid var(--clay);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
nav{display:flex;justify-content:space-between;align-items:center;padding:10px 4%;border-bottom:1px solid #b3bfce;font-size:clamp(11px,1.5vw,15px);letter-spacing:.08em}
nav button{background:none;border:0;font:inherit;color:var(--ink);cursor:pointer;padding:4px 6px;border-bottom:1px solid transparent}
nav button:hover,nav button[aria-current=true]{border-bottom-color:var(--clay);color:var(--clay)}
nav .sig{font-family:'Press Start 2P',monospace;font-size:clamp(7px,1vw,10px)}
.pages{position:relative;flex:1}
section{position:absolute;inset:0;padding:5% 7%;overflow:auto;opacity:0;visibility:hidden;transition:opacity .45s,visibility .45s;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
section.on{opacity:1;visibility:visible}
h1{font-family:'Press Start 2P',monospace;font-weight:400;font-size:56px;white-space:nowrap;margin:0;line-height:1.1;letter-spacing:.02em;color:#111;text-shadow:3px 3px 0 var(--blush);cursor:default}
h1 span{display:inline-block;transition:transform .15s}
h1 span:hover{transform:translateY(-8px) rotate(-4deg);color:var(--clay)}
h2{font-family:'Press Start 2P',monospace;font-weight:400;font-size:clamp(11px,2vw,20px);margin:0 0 14px;color:#111}
p{font-size:clamp(14px,2vw,20px);line-height:1.5;margin:.5em 0;max-width:52ch}
.tag{font-style:italic;font-size:clamp(14px,2.2vw,22px);letter-spacing:.12em;margin-top:18px}
.hint{font-size:12px;opacity:.6;margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.chip{border:1px solid var(--clay);border-radius:99px;padding:3px 12px;font-size:clamp(12px,1.6vw,16px);background:transparent;cursor:pointer;color:var(--ink);font-family:inherit;transition:background .2s}
.chip:hover,.chip.sel{background:var(--clay);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;margin-top:6px}
.card{border:1.5px solid var(--clay);border-radius:12px 12px 4px 4px;padding:12px 10px;background:var(--paper2);text-align:left;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .2s,background .2s}
.card:hover{transform:rotate(-1.5deg) translateY(-3px);background:var(--blush)}
.card b{display:block;font-size:clamp(13px,1.9vw,18px)}
.card i{font-size:clamp(11px,1.5vw,14px);opacity:.75}
.card.hide{display:none}
#detail{min-height:3.2em;font-size:clamp(13px,1.8vw,17px);font-style:italic;margin-top:12px}
.links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.links a{border:1px solid var(--clay);padding:8px 18px;letter-spacing:.1em;font-size:clamp(11px,1.5vw,14px);color:var(--ink);text-decoration:none;transition:background .2s}
.links a:hover{background:var(--clay);color:#fff}
.next{position:absolute;right:calc(10% - 22px);top:50%;transform:translateY(-50%);width:clamp(34px,5vw,50px);height:clamp(34px,5vw,50px);border-radius:50%;border:0;background:#f7f3ea;box-shadow:0 2px 8px #0003;font-size:22px;cursor:pointer;color:#444;z-index:5;transition:transform .2s}
.next:hover{transform:translateY(-50%) scale(1.1)}
.dots{position:absolute;bottom:2.5%;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:4}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--clay);opacity:.35;transition:opacity .3s}
.dots i.on{opacity:1}
#vine{position:absolute;left:-3%;top:-9%;width:34%;height:112%;pointer-events:none;z-index:3;overflow:visible}
#vine g.sw{transform-box:fill-box;transform-origin:top center;animation:sway 5s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(5deg)}}
button:focus-visible,a:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
@media (max-width:640px){.stage{aspect-ratio:.95/1;width:96vw}.badge{width:72%}#vine{width:52%}.screen{left:14%;right:14%}.grid{grid-template-columns:1fr}.next{right:calc(14% - 20px)}}
@media (prefers-reduced-motion:reduce){#vine g.sw{animation:none}section{transition:none}}
</style>
</head>

 function rnd(i,s){var x=Math.sin(i*12.9898+s*78.233)*43758.5453;return x-Math.floor(x)}
 var LP='M0 4C-4 -6 -24 -8 -30 8C-35 30 -14 48 0 64C14 48 35 30 30 8C24 -8 4 -6 0 4z';
 function leafDef(id,g,vr){
  var b=vr?'<path d="M-19 14C-11 9 -6 21 -14 29C-23 27 -23 18 -19 14z" fill="#e3e98a" opacity=".8"/><path d="M15 29C23 25 25 34 19 41C12 41 10 34 15 29z" fill="#e3e98a" opacity=".75"/><path d="M-5 47C2 43 8 49 3 56C-3 58 -6 52 -5 47z" fill="#e3e98a" opacity=".7"/>':'';
  return '<clipPath id="c'+id+'"><path d="'+LP+'"/></clipPath><g id="'+id+'"><path d="'+LP+'" fill="url(#'+g+')" stroke="#14381f" stroke-width=".8"/><g clip-path="url(#c'+id+')">'+b+'<path d="M0 4Q3 34 0 64L40 64L40 -10Z" fill="#000" opacity=".13"/><ellipse cx="-14" cy="20" rx="7" ry="12" fill="#fff" opacity=".1" transform="rotate(-20 -14 20)"/></g><path d="M0 5Q1.5 34 0 62" stroke="#d5e6a0" stroke-width="1.1" fill="none"/><path d="M0 14Q-12 12 -22 15M0 26Q-13 24 -25 30M0 39Q-9 39 -16 46M0 14Q12 12 22 15M0 26Q13 24 25 30M0 39Q9 39 16 46" stroke="#d5e6a0" stroke-width=".6" fill="none" opacity=".6"/></g>';
 }
 var defs='<defs><linearGradient id="gA" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#4a9640"/><stop offset="1" stop-color="#1c4f2b"/></linearGradient><linearGradient id="gB" x1=".2" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#9cc653"/><stop offset="1" stop-color="#3f8a3a"/></linearGradient>'+leafDef('lA','gA',1)+leafDef('lB','gB',0)+'</defs>';
 v.innerHTML=defs;
 var stems='',leaves='';
 function vine(d,n,sc,seed){
  var m=document.createElementNS(NS,'path');m.setAttribute('d',d);v.appendChild(m);
  var L=m.getTotalLength();
  stems+='<path d="'+d+'" fill="none" stroke="#56612a" stroke-width="3.4" stroke-linecap="round"/><path d="'+d+'" fill="none" stroke="#a3b25a" stroke-width="1" stroke-dasharray="1 9" stroke-linecap="round"/>';
  for(var i=0;i<n;i++){
   var p=m.getPointAtLength((i+.6)/(n+.2)*L),side=i%2?1:-1,q=rnd(i,seed),ex=p.x+side*(9+q*9),ey=p.y+5+q*6,
   s=sc*(1.05-.45*i/n)*(.85+.3*q),a=-side*(8+q*38);
   leaves+='<path d="M'+p.x+' '+p.y+'Q'+(p.x+side*12)+' '+(p.y-5)+' '+ex+' '+ey+'" fill="none" stroke="#6a7a36" stroke-width="1.6" stroke-linecap="round"/>'+
   '<g transform="translate('+ex+' '+ey+') rotate('+a+') scale('+s+')"><g class="sw" style="animation-delay:-'+((i*.7+seed)%5)+'s"><use href="#'+((i+seed)%3?'lA':'lB')+'"/></g></g>';
  }
  v.removeChild(m);
 }
 vine('M12 6C84 34 28 112 84 164S52 280 104 332S92 392 124 414',12,1,1);
 vine('M-5 14C70 -2 120 30 190 8',5,.7,3);
 v.innerHTML=defs+stems+leaves;
 // pages
 var secs=[].slice.call(document.querySelectorAll('section')),navb=[].slice.call(document.querySelectorAll('nav button')),dots=[].slice.call(document.querySelectorAll('#dots i')),cur=0;
 function go(n){cur=(n+secs.length)%secs.length;
  secs.forEach(function(s,i){s.classList.toggle('on',i==cur)});
  dots.forEach(function(d,i){d.classList.toggle('on',i==cur)});
  navb.forEach(function(b){b.setAttribute('aria-current',+b.dataset.go==cur)});}
 navb.forEach(function(b){b.onclick=function(){go(+b.dataset.go)}});
 document.getElementById('next').onclick=function(){go(cur+1)};
 addEventListener('keydown',function(e){if(e.key=='ArrowRight')go(cur+1);if(e.key=='ArrowLeft')go(cur-1)});
 // about chips
 var info={Design:'Layouts, type and little details that make a page feel hand-made.',Writing:'Words with a soft voice and a clear point.',Code:'Turning pretty ideas into things you can click.',Photography:'Light through leaves, quiet corners, everyday stuff.'};
 [].forEach.call(document.querySelectorAll('.chip'),function(c){c.onclick=function(){
  [].forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.remove('sel')});c.classList.add('sel');
  document.getElementById('detail').textContent=info[c.textContent]}});
 // work cards
 [].forEach.call(document.querySelectorAll('.card'),function(c){c.onclick=function(){document.getElementById('wd').textContent=c.dataset.d}});
 document.getElementById('wd').style.cssText='font-style:italic;margin-top:12px;font-size:15px;min-height:2.6em';
})();
</script>
